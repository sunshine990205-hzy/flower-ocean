<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070009"><title>Merry Christmas Xiaoyu ✨</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050006;color:white;font-family:Georgia,"PingFang SC",serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}body:after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 45% 56%,transparent 28%,rgba(0,0,0,.42) 100%)}
.words{position:fixed;z-index:3;top:25%;right:5%;width:41%;text-align:center;pointer-events:none;animation:enter 2.4s both}.words .tiny{font-size:clamp(10px,1.15vw,15px);letter-spacing:.42em;color:#ffd9ec;text-transform:uppercase}.words h1{font-weight:400;font-style:italic;font-size:clamp(27px,4.8vw,85px);line-height:1.14;margin:17px 0 9px;color:#fff0f6;text-shadow:0 0 8px #fff,0 0 24px var(--glow,#ff278e),0 0 55px var(--glow,#ff278e)}.words .name{font-size:clamp(19px,2.7vw,42px);letter-spacing:.2em;color:#ffc5e3;text-shadow:0 0 19px var(--glow,#ff278e)}.words .line{width:60%;height:1px;background:linear-gradient(90deg,transparent,#ffacd8,transparent);margin:24px auto 0;box-shadow:0 0 15px #ff46a7}.heart{margin-top:15px;color:#ffa9d1;font-size:20px;animation:pulse 2s infinite}.toolbar{position:fixed;z-index:5;left:20px;bottom:20px;padding:13px 15px;border:1px solid #ff83c044;border-radius:19px;background:#180919aa;backdrop-filter:blur(16px);box-shadow:0 0 35px #ff14891c}.toolbar .heading{font-size:11px;letter-spacing:.13em;color:#ffc5e2;margin-bottom:10px}.swatches{display:flex;gap:9px}.swatches button{width:25px;height:25px;border-radius:50%;border:2px solid #ffffff44;background:var(--c);cursor:pointer;box-shadow:0 0 12px #ffffff22}.swatches button.active{outline:2px solid white;outline-offset:3px}.actions{display:flex;gap:8px;margin-top:13px}.actions button{background:#ffffff0e;border:1px solid #ffffff35;border-radius:18px;color:#ffe7f3;padding:7px 11px;font-size:11px;cursor:pointer}.hint{position:fixed;z-index:3;bottom:28px;right:23px;color:#ffd5e5a8;font:12px system-ui;text-align:right;letter-spacing:.05em}.top{position:fixed;top:20px;left:24px;z-index:4;font-size:11px;letter-spacing:.3em;color:#ffbad8b5}@keyframes enter{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{50%{transform:scale(1.15);opacity:.6}}@media(max-width:700px){.words{top:9%;right:5%;width:90%}.words h1{font-size:clamp(33px,9vw,52px);margin:10px 0 5px}.words .name{font-size:22px}.words .line{margin:12px auto 0}.heart{margin-top:7px}.toolbar{left:50%;transform:translateX(-50%);bottom:24px;width:max-content;max-width:94%;padding:12px 15px}.hint{bottom:129px;left:0;right:0;text-align:center;font-size:10px}.top{font-size:9px;top:12px;left:12px}}
</style></head><body>
<canvas id="scene"></canvas><div class="top">A LITTLE CHRISTMAS MAGIC · 2026</div><section class="words"><div class="tiny">A special wish for you</div><h1>Merry Christmas</h1><div class="name">Xiaoyu ✦ 小雨</div><div class="line"></div><div class="heart">♡</div></section>
<div class="toolbar"><div class="heading">CHOOSE YOUR MAGIC ✦</div><div class="swatches" id="colors"><button class="active" style="--c:#ff2398" data-color="#ff2398" aria-label="Pink"></button><button style="--c:#bb54ff" data-color="#bb54ff" aria-label="Purple"></button><button style="--c:#37cfff" data-color="#37cfff" aria-label="Blue"></button><button style="--c:#ffd36b" data-color="#ffd36b" aria-label="Gold"></button><button style="--c:#66ffa5" data-color="#66ffa5" aria-label="Green"></button><button style="--c:#ffffff" data-color="#ffffff" aria-label="White"></button></div><div class="actions"><button id="snow">❄ Snow ON</button><button id="spin">✦ Auto rotate ON</button><button id="burst">♡ Make a wish</button></div></div>
<div class="hint">Drag to rotate · Tap to make stars ✨</div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d',{alpha:false});let W=0,H=0,DPR=1,t=0,rotation=0,dragging=false,lastX=0,moved=0,auto=true,snow=true,hue='#ff2398',particles=[],stars=[],flakes=[],bursts=[],reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function rand(a,b){return a+Math.random()*(b-a)}function hexRgb(h){return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16))}function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);stars=Array.from({length:Math.min(340,Math.floor(W*H/2600))},()=>({x:Math.random()*W,y:Math.random()*H,r:rand(.3,1.7),a:rand(.15,.85),p:rand(0,7)}));flakes=Array.from({length:75},()=>({x:Math.random()*W,y:Math.random()*H,r:rand(.5,2),v:rand(.25,1.1),phase:rand(0,7)}));makeTree()}
function makeTree(){particles=[];let count=W<700?3500:6800;for(let i=0;i<count;i++){let q=Math.random(),y=q*2-1,r=(1-q)*1.17;let a=rand(0,Math.PI*2),rad=r*Math.sqrt(Math.random());particles.push({kind:0,x:Math.cos(a)*rad,y,z:Math.sin(a)*rad,s:rand(.45,1.6),tw:rand(0,7),bright:rand(.35,1),depth:Math.random()})}for(let j=0;j<4100;j++){let q=j/4100,y=q*2-1,theta=(1-q)*Math.PI*15;let rad=(1-q)*1.29+rand(-.035,.035);particles.push({kind:1,x:Math.cos(theta)*rad,y:y+rand(-.009,.009),z:Math.sin(theta)*rad,s:rand(.8,2.2),tw:rand(0,7),bright:rand(.6,1)})}for(let j=0;j<2400;j++){let theta=rand(0,Math.PI*2),r=rand(.75,2.3);particles.push({kind:2,x:Math.cos(theta)*r,y:-1.07+rand(-.025,.025),z:Math.sin(theta)*r,s:rand(.4,1.4),tw:rand(0,7),bright:rand(.2,.9)})}}
function point(p,rot,scale,cx,cy){let a=rot,x=p.x*Math.cos(a)-p.z*Math.sin(a),z=p.x*Math.sin(a)+p.z*Math.cos(a),pers=3.7/(3.7+z*.37);return {x:cx+x*scale*pers,y:cy-p.y*scale*pers*.91+z*scale*.055,r:pers,z}}
function spark(x,y,num){for(let i=0;i<num;i++){let a=rand(0,7),v=rand(.7,4.8);bursts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(25,65),max:65,s:rand(.7,2.6)})}}
function draw(){t+=reduced?.004:.012;if(auto&&!dragging)rotation+=reduced?.0008:.003;ctx.fillStyle='#050006';ctx.fillRect(0,0,W,H);let c=hexRgb(hue),cx=W<700?W*.5:W*.37,cy=W<700?H*.57:H*.53,scale=Math.min(W<700?W*.39:W*.22,H*(W<700?.255:.38));let glow=ctx.createRadialGradient(cx,cy,0,cx,cy,scale*2.3);glow.addColorStop(0,'rgba('+c.join(',')+',.115)');glow.addColorStop(1,'transparent');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
for(let s of stars){let a=s.a*(.7+.3*Math.sin(t+s.p));ctx.fillStyle='rgba(255,216,240,'+a+')';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}
ctx.globalCompositeOperation='lighter';for(let p of particles){let v=point(p,rotation,scale,cx,cy),pulse=.7+.3*Math.sin(t*2+p.tw),alpha=p.bright*pulse*(p.kind===0?.62:p.kind===1?.95:.42);if(v.x<0||v.x>W||v.y<0||v.y>H)continue;let radius=p.s*v.r*(p.kind===1?1.2:1);ctx.fillStyle=p.kind===1?'rgba(255,234,247,'+alpha+')': 'rgba('+c.join(',')+','+alpha+')';ctx.beginPath();ctx.arc(v.x,v.y,radius,0,7);ctx.fill();if(p.kind===1&&p.s>1.85&&Math.sin(t+p.tw)>.7){ctx.fillStyle='rgba('+c.join(',')+',.09)';ctx.beginPath();ctx.arc(v.x,v.y,radius*4,0,7);ctx.fill()}}
let top=point({x:0,y:1.055,z:0},rotation,scale,cx,cy),sz=Math.max(10,scale*.095);ctx.save();ctx.translate(top.x,top.y);ctx.rotate(-Math.PI/2);ctx.shadowBlur=28;ctx.shadowColor=hue;ctx.fillStyle='#fff4fc';ctx.beginPath();for(let i=0;i<10;i++){let a=i*Math.PI/5,r=i%2?sz*.43:sz;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.restore();ctx.globalCompositeOperation='source-over';
if(snow)for(let f of flakes){f.y+=f.v*(reduced?.15:1);f.x+=Math.sin(t+f.phase)*.16;if(f.y>H+5){f.y=-5;f.x=Math.random()*W}ctx.fillStyle='rgba(255,225,242,.45)';ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,7);ctx.fill()}
ctx.globalCompositeOperation='lighter';for(let i=bursts.length-1;i>=0;i--){let b=bursts[i];b.x+=b.vx;b.y+=b.vy;b.vy+=.012;b.life--;ctx.fillStyle='rgba('+c.join(',')+','+Math.max(0,b.life/b.max)+')';ctx.beginPath();ctx.arc(b.x,b.y,b.s,0,7);ctx.fill();if(b.life<=0)bursts.splice(i,1)}ctx.globalCompositeOperation='source-over';requestAnimationFrame(draw)}
canvas.addEventListener('pointerdown',e=>{dragging=true;moved=0;lastX=e.clientX;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(dragging){let d=e.clientX-lastX;rotation+=d*.009;moved+=Math.abs(d);lastX=e.clientX}});canvas.addEventListener('pointerup',e=>{dragging=false;if(moved<12)spark(e.clientX,e.clientY,65)});canvas.addEventListener('pointercancel',()=>dragging=false);
document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{hue=b.dataset.color;document.documentElement.style.setProperty('--glow',hue);document.querySelectorAll('[data-color]').forEach(x=>x.classList.toggle('active',x===b));spark(W*.5,H*.5,90)});
document.getElementById('snow').onclick=e=>{snow=!snow;e.target.textContent='❄ Snow '+(snow?'ON':'OFF')};document.getElementById('spin').onclick=e=>{auto=!auto;e.target.textContent='✦ Auto rotate '+(auto?'ON':'OFF')};document.getElementById('burst').onclick=()=>spark(W*(W<700?.5:.37),H*.52,200);addEventListener('resize',resize);resize();requestAnimationFrame(draw);
})();
</script></body></html>
