<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050008"><title>Merry Christmas · Xiaoyu</title>
<style>
:root{--accent:#ff168c}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#040006;color:#fff;font-family:Georgia,serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.text{position:fixed;top:18%;right:5%;width:39%;text-align:center;pointer-events:none;z-index:2}.eyebrow{font:10px system-ui;letter-spacing:.35em;color:#eeb6d2}.text h1{font-weight:400;font-style:italic;font-size:clamp(32px,5.1vw,78px);line-height:1.05;margin:20px 0 12px;color:#ffeaf5;text-shadow:0 0 12px #ff81c6,0 0 38px var(--accent)}.text .name{font-size:clamp(20px,2.5vw,38px);letter-spacing:.16em;color:#ffc8e3;text-shadow:0 0 25px var(--accent)}.rule{height:1px;width:70%;margin:24px auto;background:linear-gradient(90deg,transparent,#ff87c3,transparent)}.heart{font-size:23px;color:#ff9cce;text-shadow:0 0 14px var(--accent)}.controls{position:fixed;z-index:5;left:24px;bottom:23px;border:1px solid #ff9bcb44;background:#140613b8;backdrop-filter:blur(14px);border-radius:18px;padding:13px 17px;box-shadow:0 8px 38px #0009}.label{font:10px system-ui;letter-spacing:.2em;color:#ffd0e7;margin-bottom:13px}.swatches{display:flex;gap:11px}.swatches button{width:25px;height:25px;border-radius:50%;background:var(--color);border:1px solid #fff7;cursor:pointer}.swatches .active{outline:2px solid #fff;outline-offset:3px}.buttons{display:flex;gap:8px;margin-top:14px}.buttons button{font:11px system-ui;color:#ffe9f4;background:#ffffff0d;border:1px solid #ffffff40;border-radius:20px;padding:8px 10px;cursor:pointer}.hint{position:fixed;right:25px;bottom:35px;font:11px system-ui;letter-spacing:.08em;color:#ffd3e3a6}.top{position:fixed;top:18px;left:22px;font:10px system-ui;letter-spacing:.24em;color:#f8bad3a6}@media(max-width:700px){.text{top:8%;left:4%;right:4%;width:92%}.eyebrow{font-size:9px}.text h1{font-size:clamp(34px,9.2vw,54px);margin:12px 0 8px}.text .name{font-size:22px}.rule{margin:11px auto}.heart{font-size:17px}.controls{bottom:17px;left:50%;transform:translateX(-50%);width:max-content;max-width:96%;padding:12px 15px}.hint{bottom:119px;left:0;right:0;text-align:center;font-size:10px}.top{top:10px;left:10px;font-size:8px}}
</style></head><body><canvas id="c"></canvas><div class="top">CHRISTMAS MAGIC · 2026</div><section class="text"><div class="eyebrow">A LITTLE MAGIC, JUST FOR YOU</div><h1>Merry Christmas</h1><div class="name">Xiaoyu · 小雨</div><div class="rule"></div><div class="heart">♡</div></section><section class="controls"><div class="label">CHOOSE YOUR MAGIC ✦</div><div class="swatches" id="colors"><button class="active" style="--color:#ff168c" data-color="#ff168c"></button><button style="--color:#ba45ff" data-color="#ba45ff"></button><button style="--color:#32cfff" data-color="#32cfff"></button><button style="--color:#ffc75a" data-color="#ffc75a"></button><button style="--color:#50f6aa" data-color="#50f6aa"></button><button style="--color:#ffffff" data-color="#ffffff"></button></div><div class="buttons"><button id="snow">❄ Snow ON</button><button id="spin">✦ Rotate ON</button><button id="wish">♡ Make a wish</button></div></section><div class="hint">Drag to rotate · Tap for a little magic ✨</div>
<script>
(()=>{'use strict';const cv=document.getElementById('c'),ctx=cv.getContext('2d',{alpha:false});let w,h,dpr,scale,cx,cy,rot=.4,t=0,auto=true,snow=true,drag=false,last=0,moved=0,accent='#ff168c',rgb=[255,22,140],pts=[],stars=[],flakes=[],bursts=[];const rnd=(a,b)=>a+Math.random()*(b-a),pi=Math.PI;
function setup(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);let mobile=w<700;scale=Math.min(w*(mobile?.285:.19),h*(mobile?.225:.32));cx=w*(mobile?.5:.365);cy=h*(mobile?.575:.51);stars=Array.from({length:Math.min(320,Math.floor(w*h/2400))},()=>({x:rnd(0,w),y:rnd(0,h),r:rnd(.3,1.25),a:rnd(.12,.65),p:rnd(0,7)}));flakes=Array.from({length:65},()=>({x:rnd(0,w),y:rnd(0,h),r:rnd(.4,1.5),v:rnd(.2,.7)}));build()}
function build(){pts=[];const mobile=w<700;let N=mobile?7500:13500;for(let i=0;i<N;i++){let q=Math.random(),y=-1+q*2,r=(1-q)*1.16,theta=rnd(0,2*pi),rad=r*Math.sqrt(rnd(.15,1));pts.push({x:Math.cos(theta)*rad,y:y+rnd(-.008,.008),z:Math.sin(theta)*rad,kind:0,size:rnd(.42,1.22),light:rnd(.24,.85),phase:rnd(0,7)})}
let ribbonN=mobile?10500:18500;for(let i=0;i<ribbonN;i++){let q=i/ribbonN,angle=(1-q)*pi*14.5,r=(1-q)*1.28;let jitter=rnd(-.065,.065),a=angle+rnd(-.052,.052);pts.push({x:Math.cos(a)*(r+jitter),y:-1+2*q+rnd(-.018,.018),z:Math.sin(a)*(r+jitter),kind:1,size:rnd(.32,1.05),light:rnd(.65,1),phase:rnd(0,7)})}
for(let k=0;k<5;k++){let radius=1.18+k*.24;for(let i=0;i<(mobile?850:1300);i++){let a=rnd(0,2*pi),rr=radius+rnd(-.04,.04);pts.push({x:Math.cos(a)*rr,y:-1.12+rnd(-.012,.012),z:Math.sin(a)*rr,kind:2,size:rnd(.3,1.05),light:rnd(.25,.75),phase:rnd(0,7)})}}
for(let i=0;i<(mobile?1100:1800);i++){let a=rnd(0,2*pi),r=Math.sqrt(Math.random())*2.25;pts.push({x:Math.cos(a)*r,y:-1.13+rnd(-.03,.03),z:Math.sin(a)*r,kind:2,size:rnd(.3,1.1),light:rnd(.15,.65),phase:rnd(0,7)})}}
function project(p){let sn=Math.sin(rot),cs=Math.cos(rot),x=p.x*cs-p.z*sn,z=p.x*sn+p.z*cs;let camera=4.5,persp=camera/(camera+z*.85);return {x:cx+x*scale*persp,y:cy-p.y*scale*persp*.95+z*scale*.075,z,persp}}
function explosion(x,y,n){for(let i=0;i<n;i++){let a=rnd(0,2*pi),v=rnd(.5,4);bursts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(25,70),max:70,r:rnd(.6,2.3)})}}
function draw(){t+=.013;if(auto&&!drag)rot+=.0032;ctx.fillStyle='#040006';ctx.fillRect(0,0,w,h);let g=ctx.createRadialGradient(cx,cy,0,cx,cy,scale*2.5);g.addColorStop(0,'rgba('+rgb.join(',')+',.14)');g.addColorStop(.5,'rgba('+rgb.join(',')+',.045)');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);for(let s of stars){ctx.fillStyle='rgba(255,207,234,'+(s.a*(.75+.25*Math.sin(t+s.p)))+')';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}
let projected=[];for(let p of pts){let v=project(p);if(v.x<0||v.x>w||v.y<0||v.y>h)continue;projected.push({p,v})}projected.sort((a,b)=>b.v.z-a.v.z);ctx.globalCompositeOperation='lighter';for(let item of projected){let p=item.p,v=item.v;let depth=Math.max(.28,Math.min(1.3,1-v.z*.24));let tw=.78+.22*Math.sin(t*2+p.phase);let alpha=p.light*depth*tw*(p.kind===0?.7:p.kind===1?.9:.55);let radius=p.size*v.persp*(p.kind===1?1.03:.9);let white=p.kind===1&&p.light>.87;ctx.fillStyle=white?'rgba(255,204,233,'+(alpha*.75)+')':'rgba('+rgb.join(',')+','+alpha+')';ctx.beginPath();ctx.arc(v.x,v.y,radius,0,7);ctx.fill();if(p.kind===1&&p.light>.96&&Math.sin(t+p.phase)>.6){ctx.fillStyle='rgba('+rgb.join(',')+',.075)';ctx.beginPath();ctx.arc(v.x,v.y,radius*4,0,7);ctx.fill()}}
let apex=project({x:0,y:1.05,z:0}),r=Math.max(9,scale*.075);let halo=ctx.createRadialGradient(apex.x,apex.y,0,apex.x,apex.y,r*3.5);halo.addColorStop(0,'rgba(255,240,250,.8)');halo.addColorStop(.25,'rgba('+rgb.join(',')+',.32)');halo.addColorStop(1,'transparent');ctx.fillStyle=halo;ctx.beginPath();ctx.arc(apex.x,apex.y,r*3.5,0,7);ctx.fill();ctx.save();ctx.translate(apex.x,apex.y);ctx.rotate(-pi/2);ctx.fillStyle='#ffe8f5';ctx.shadowColor=accent;ctx.shadowBlur=20;ctx.beginPath();for(let i=0;i<10;i++){let a=i*pi/5,rr=i%2?r*.43:r;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fill();ctx.restore();ctx.globalCompositeOperation='source-over';
if(snow)for(let f of flakes){f.y+=f.v;f.x+=Math.sin(t+f.y*.02)*.11;if(f.y>h){f.y=-5;f.x=rnd(0,w)}ctx.fillStyle='rgba(255,211,233,.35)';ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,7);ctx.fill()}ctx.globalCompositeOperation='lighter';for(let i=bursts.length-1;i>=0;i--){let b=bursts[i];b.x+=b.vx;b.y+=b.vy;b.vy+=.01;b.life--;ctx.fillStyle='rgba('+rgb.join(',')+','+Math.max(0,b.life/b.max)+')';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();if(b.life<=0)bursts.splice(i,1)}ctx.globalCompositeOperation='source-over';requestAnimationFrame(draw)}
cv.addEventListener('pointerdown',e=>{drag=true;moved=0;last=e.clientX;cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(drag){let d=e.clientX-last;rot+=d*.012;moved+=Math.abs(d);last=e.clientX}});cv.addEventListener('pointerup',e=>{drag=false;if(moved<10)explosion(e.clientX,e.clientY,90)});cv.addEventListener('pointercancel',()=>drag=false);document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{accent=b.dataset.color;rgb=[1,3,5].map(i=>parseInt(accent.slice(i,i+2),16));document.documentElement.style.setProperty('--accent',accent);document.querySelectorAll('[data-color]').forEach(x=>x.classList.toggle('active',x===b));explosion(cx,cy,100)});document.getElementById('snow').onclick=e=>{snow=!snow;e.target.textContent='❄ Snow '+(snow?'ON':'OFF')};document.getElementById('spin').onclick=e=>{auto=!auto;e.target.textContent='✦ Rotate '+(auto?'ON':'OFF')};document.getElementById('wish').onclick=()=>explosion(cx,cy,200);addEventListener('resize',setup);setup();requestAnimationFrame(draw);
})();
</script></body></html>
