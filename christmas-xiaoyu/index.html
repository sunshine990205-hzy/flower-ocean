<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050008"><title>Merry Christmas · Xiaoyu</title><style>
:root{--pink:#ff248f}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030005;color:#fff;font-family:Georgia,"Times New Roman",serif}#stage{position:fixed;inset:0;touch-action:none}#stage canvas{display:block;width:100%;height:100%}body:after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 28%,#0500068a 100%)}.greeting{position:fixed;z-index:3;top:31%;right:5%;width:38%;text-align:center;pointer-events:none}.kicker{font:9px system-ui;letter-spacing:.38em;color:#ffb4d4}.greeting h1{font-size:clamp(20px,2.65vw,39px);font-weight:400;font-style:italic;line-height:1.1;margin:20px 0 12px;color:#fff1f8;text-shadow:0 0 18px #ff79bc,0 0 48px var(--pink)}.greeting .name{font-size:clamp(16px,2vw,28px);letter-spacing:.16em;color:#ffcae4;text-shadow:0 0 20px var(--pink)}.greeting .line{width:70%;height:1px;margin:22px auto;background:linear-gradient(90deg,transparent,#ff7dbc,transparent)}.greeting .heart{font-size:21px;color:#ff9cca;text-shadow:0 0 20px var(--pink)}.controls{position:fixed;z-index:5;left:20px;bottom:20px;border:1px solid #ff95c84a;border-radius:16px;padding:12px 15px;background:#140813c9;backdrop-filter:blur(14px)}.controls .title{font:10px system-ui;letter-spacing:.19em;color:#ffd0e5;margin-bottom:12px}.colors{display:flex;gap:10px}.colors button{width:25px;height:25px;border:1px solid #ffffff66;border-radius:50%;background:var(--c);cursor:pointer}.colors button.selected{outline:2px solid white;outline-offset:3px}.actions{display:flex;gap:8px;margin-top:14px}.actions button{border:1px solid #ffffff35;background:#ffffff0b;color:#ffe3f2;border-radius:18px;padding:8px 10px;font:11px system-ui;cursor:pointer}.hint{position:fixed;z-index:4;bottom:32px;right:22px;color:#ffcadeaa;font:11px system-ui}.brand{position:fixed;top:17px;left:19px;z-index:3;font:9px system-ui;letter-spacing:.25em;color:#ffc0ddaa}.error{display:none;position:fixed;z-index:8;top:50%;left:50%;transform:translate(-50%,-50%);width:80%;text-align:center;font:13px system-ui;color:#ffd3e7}.error.show{display:block}@media(max-width:700px){.greeting{top:34%;left:auto;right:2%;width:43%}.greeting h1{font-size:clamp(17px,4.2vw,25px);margin:10px 0 8px}.greeting .name{font-size:13px}.greeting .line{margin:9px auto}.controls{bottom:13px;left:50%;transform:translateX(-50%);max-width:96%;width:max-content;padding:11px 14px}.hint{bottom:119px;left:0;right:0;text-align:center;font-size:10px}.brand{font-size:8px;top:9px;left:10px}}
</style></head><body><div id="stage"></div><div class="brand">A LITTLE CHRISTMAS MAGIC · 2026</div><section class="greeting"><div class="kicker">A SPECIAL WISH FOR YOU</div><h1>Merry Christmas</h1><div class="name">Xiaoyu · 小雨</div><div class="line"></div><div class="heart">♡</div></section><div class="controls"><div class="title">CHOOSE YOUR MAGIC ✦</div><div class="colors"><button class="selected" style="--c:#ff248f" data-color="#ff248f" aria-label="Pink"></button><button style="--c:#ac4bff" data-color="#ac4bff" aria-label="Purple"></button><button style="--c:#36cfff" data-color="#36cfff" aria-label="Blue"></button><button style="--c:#ffc75e" data-color="#ffc75e" aria-label="Gold"></button><button style="--c:#60f3a4" data-color="#60f3a4" aria-label="Green"></button><button style="--c:#fff0fa" data-color="#fff0fa" aria-label="White"></button></div><div class="actions"><button id="snow">❄ Snow ON</button><button id="rotate">✦ Rotate ON</button><button id="wish">♡ Make a wish</button></div></div><div class="hint">Drag to orbit in 3D · Tap to make a wish ✨</div><div id="error" class="error">3D graphics could not load. Please open in Safari or Chrome with an internet connection.</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';
const root=document.getElementById('stage'),mobile=()=>innerWidth<700;
let renderer;try{renderer=new THREE.WebGLRenderer({antialias:false,alpha:false,powerPreference:'high-performance'});}catch(e){document.getElementById('error').classList.add('show');throw e}
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x030005);renderer.outputColorSpace=THREE.SRGBColorSpace;root.appendChild(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,120),tree=new THREE.Group();scene.add(tree);
let current='#ff248f',auto=true,snowOn=true,drag=false,lastX=0,lastY=0,moved=0,orbitX=.28,orbitY=.12,particles=[],snowSystem=null,burstSystem=null,burstLife=0;
const rand=(a,b)=>a+Math.random()*(b-a),PI=Math.PI;
function cloud(count,fill,type,size,opacity){const pos=new Float32Array(count*3),col=new Float32Array(count*3),sizes=new Float32Array(count),phases=new Float32Array(count);for(let i=0;i<count;i++){const p=fill(i,count);pos.set(p,i*3);sizes[i]=rand(.45,1.25);phases[i]=rand(0,6.28)}let geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('aSize',new THREE.BufferAttribute(sizes,1));geo.setAttribute('aPhase',new THREE.BufferAttribute(phases,1));const mat=new THREE.ShaderMaterial({uniforms:{uColor:{value:new THREE.Color(current)},uTime:{value:0},uOpacity:{value:opacity},uSize:{value:size}},vertexShader:'attribute float aSize; attribute float aPhase; varying float vPhase; varying float vDepth; uniform float uTime; uniform float uSize; void main(){vPhase=aPhase; vec4 mv=modelViewMatrix*vec4(position,1.0); vDepth=clamp(7.0/(-mv.z),.45,1.5); gl_PointSize=clamp(uSize*aSize*(7.0/-mv.z),1.0,22.0); gl_Position=projectionMatrix*mv;}',fragmentShader:'uniform vec3 uColor; uniform float uTime; uniform float uOpacity; varying float vPhase; varying float vDepth; void main(){vec2 uv=gl_PointCoord-.5; float r=length(uv); float core=exp(-r*r*24.0); float halo=exp(-r*r*5.0)*.28; float twinkle=.78+.22*sin(uTime*2.0+vPhase); float alpha=(core+halo)*uOpacity*twinkle; vec3 c=mix(uColor,vec3(1.0,.80,.92),.30); gl_FragColor=vec4(c*min(1.25,vDepth),alpha);}',transparent:true,depthWrite:false,depthTest:true,blending:THREE.AdditiveBlending});let points=new THREE.Points(geo,mat);tree.add(points);particles.push(points);return points}
const treeN=mobile()?33000:47000;
// A diffuse, all-screen glitter field provides the reference's cinematic granular atmosphere.
cloud(mobile()?9000:15000,()=>{let a=rand(0,PI*2),r=Math.sqrt(Math.random())*rand(1.9,4.9);return [Math.cos(a)*r,rand(-2.5,-1.9),Math.sin(a)*r]},6,2.7,.29);
cloud(treeN,()=>{let q=Math.random(),a=rand(0,PI*2),r=Math.sqrt(Math.random())*1.46*(1-q);return [Math.cos(a)*r,-2.1+q*4.1,Math.sin(a)*r]},0,5.1,.72);
cloud(mobile()?32000:47000,(i,n)=>{let q=i/n,a=(1-q)*PI*17.0,rr=1.62*(1-q)+rand(-.035,.035);return [Math.cos(a)*rr,-2.1+4.12*q+rand(-.018,.018),Math.sin(a)*rr]},1,6.4,.72);
cloud(mobile()?6500:9000,(i,n)=>{let a=rand(0,2*PI),r=rand(.7,2.8);return [Math.cos(a)*r,-2.19+rand(-.02,.02),Math.sin(a)*r]},2,3.7,.52);
cloud(mobile()?4000:6000,(i,n)=>{let k=i%5,r=1.55+k*.29+rand(-.025,.025),a=rand(0,2*PI);return [Math.cos(a)*r,-2.18+rand(-.01,.01),Math.sin(a)*r]},3,4.0,.56);
// Additional luminous multi-strand helixes create the intertwined pink/white ribbons of the reference.
for(let strand=0;strand<3;strand++){
 const offset=strand*2.094;
 const n=mobile()?10500:16000;
 cloud(n,(i,total)=>{const q=i/total,a=(1-q)*PI*(13.5+strand*.9)+offset,r=(1-q)*(1.54+strand*.045)+rand(-.025,.025);return [Math.cos(a)*r,-2.1+4.1*q+rand(-.014,.014),Math.sin(a)*r]},4, strand===0?8.0:5.8,strand===0?.72:.48);
}
const starShape=new THREE.Shape();for(let i=0;i<10;i++){let a=i*PI/5-PI/2,r=i%2?.075:.18;let x=Math.cos(a)*r,y=Math.sin(a)*r;i?starShape.lineTo(x,y):starShape.moveTo(x,y)}starShape.closePath();let star=new THREE.Mesh(new THREE.ShapeGeometry(starShape),new THREE.MeshBasicMaterial({color:0xffe4f2,side:THREE.DoubleSide}));star.position.y=2.14;star.scale.setScalar(.65);tree.add(star);
const glowTexture=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.14,'rgba(255,195,228,.82)');g.addColorStop(.43,'rgba(255,42,145,.22)');g.addColorStop(1,'rgba(255,10,115,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)})();
const starLight=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTexture,color:0xff9dcc,transparent:true,opacity:.55,blending:THREE.AdditiveBlending,depthWrite:false}));starLight.scale.set(.8,.8,1);starLight.position.y=2.14;tree.add(starLight);
// Wide glowing concentric floor orbits, drawn in real 3D perspective.
for(let ring=0;ring<12;ring++){
 const n=mobile()?1800:2600,radius=1.72+ring*.18;
 cloud(n,(i,total)=>{let a=i/total*PI*2+rand(-.009,.009),r=radius+rand(-.03,.03);return [Math.cos(a)*r,-2.20+rand(-.013,.013),Math.sin(a)*r]},5,ring%3===0?5.8:3.8,ring%3===0?.62:.30);
}
let background=new THREE.BufferGeometry(),bgPos=new Float32Array(6500*3);for(let i=0;i<6500;i++){bgPos[i*3]=rand(-24,24);bgPos[i*3+1]=rand(-14,14);bgPos[i*3+2]=rand(-20,-4)}background.setAttribute('position',new THREE.BufferAttribute(bgPos,3));scene.add(new THREE.Points(background,new THREE.PointsMaterial({color:0xeaa6d2,size:.052,transparent:true,opacity:.78,sizeAttenuation:true})));
let snowGeo=new THREE.BufferGeometry(),snowPos=new Float32Array(1100*3);for(let i=0;i<1100;i++){snowPos[i*3]=rand(-8,8);snowPos[i*3+1]=rand(-6,8);snowPos[i*3+2]=rand(-4,5)}snowGeo.setAttribute('position',new THREE.BufferAttribute(snowPos,3));snowSystem=new THREE.Points(snowGeo,new THREE.PointsMaterial({color:0xffb5d6,size:.038,transparent:true,opacity:.62}));scene.add(snowSystem);
function makeBurst(){if(burstSystem){scene.remove(burstSystem);burstSystem.geometry.dispose();burstSystem.material.dispose()}let arr=new Float32Array(900);for(let i=0;i<300;i++){let a=rand(0,PI*2),b=rand(-1,1),r=rand(.05,.5);arr.set([Math.cos(a)*r, b*r,Math.sin(a)*r],i*3)}let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(arr,3));burstSystem=new THREE.Points(g,new THREE.PointsMaterial({color:new THREE.Color(current),size:.055,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false}));tree.add(burstSystem);burstLife=1}
function cameraLayout(){let m=mobile();camera.aspect=innerWidth/innerHeight;camera.fov=m?43:40;camera.position.set(m?0:0,m?.2:.2,m?11.3:10.9);camera.lookAt(0,0,0);camera.updateProjectionMatrix();tree.position.set(m?-1.0:-1.4,m?-.28:0,0);tree.scale.setScalar(m?.88:1.12);renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7))}
cameraLayout();addEventListener('resize',cameraLayout);
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;moved=0;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-lastX,dy=e.clientY-lastY;orbitX+=dx*.008;orbitY=Math.max(-.35,Math.min(.35,orbitY+dy*.003));moved+=Math.abs(dx)+Math.abs(dy);lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener('pointerup',()=>{drag=false;if(moved<12)makeBurst()});renderer.domElement.addEventListener('pointercancel',()=>drag=false);
document.querySelectorAll('[data-color]').forEach(b=>b.addEventListener('click',()=>{current=b.dataset.color;document.documentElement.style.setProperty('--pink',current);document.querySelectorAll('[data-color]').forEach(x=>x.classList.toggle('selected',x===b));for(let p of particles)p.material.uniforms.uColor.value.set(current);makeBurst()}));document.getElementById('snow').onclick=e=>{snowOn=!snowOn;snowSystem.visible=snowOn;e.target.textContent='❄ Snow '+(snowOn?'ON':'OFF')};document.getElementById('rotate').onclick=e=>{auto=!auto;e.target.textContent='✦ Rotate '+(auto?'ON':'OFF')};document.getElementById('wish').onclick=makeBurst;
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.05),time=clock.elapsedTime;if(auto&&!drag)orbitX+=dt*.22;tree.rotation.y=orbitX;tree.rotation.x=orbitY;for(let p of particles)p.material.uniforms.uTime.value=time;if(snowOn){let pos=snowGeo.attributes.position;for(let i=0;i<pos.count;i++){let y=pos.getY(i)-dt*.45;if(y< -6)y=8;pos.setY(i,y)}pos.needsUpdate=true}if(burstSystem&&burstLife>0){burstLife-=dt*.75;burstSystem.scale.multiplyScalar(1+dt*1.5);burstSystem.material.opacity=Math.max(0,burstLife);burstSystem.visible=burstLife>0}star.rotation.z=time*.17;renderer.render(scene,camera)}animate();
</script></body></html>
