<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff4ed" />
  <meta name="description" content="一只会哭会认错的可爱3D道歉小人，快来戳戳他！" />
  <meta property="og:title" content="对不起啦！🥹" />
  <meta property="og:description" content="点一下他，就会乖乖认错。" />
  <title>对不起啦！｜互动道歉小人</title>
  <style>
    :root{color-scheme:light;--ink:#5f3944;--pink:#ec6f94;--pink-dark:#cc5578;--cream:#fff9f4;--muted:#9a7a83;--round:28px}
    *{box-sizing:border-box}
    html{min-height:100%;-webkit-tap-highlight-color:transparent}
    body{margin:0;min-height:100vh;min-height:100dvh;overflow-x:hidden;color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;background:radial-gradient(circle at 14% 4%,#ffe0d9 0 9%,transparent 32%),radial-gradient(circle at 89% 30%,#ffe2ed 0 8%,transparent 34%),linear-gradient(155deg,#fff9f2 0%,#fff2ee 58%,#ffeaf1 100%)}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.42;background-image:radial-gradient(#e9a8b6 0.8px,transparent 0.8px);background-size:23px 23px;mask-image:linear-gradient(to bottom,#0002,transparent 75%)}
    button{font:inherit}
    .page{position:relative;max-width:680px;margin:0 auto;padding:24px 17px 30px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:20px}
    .brand{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:900;letter-spacing:2px;color:#b66e81}
    .brand-icon{display:grid;place-items:center;width:34px;height:34px;background:#fff8fb;border:1px solid #f7c8d4;border-radius:12px;box-shadow:0 5px 10px #e99caa19;font-size:18px;letter-spacing:0}
    .sound{border:1px solid #f2ced4;background:#fff9fa;color:#b17482;border-radius:30px;padding:9px 13px;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:800;cursor:pointer;box-shadow:0 3px 8px #d993a318}
    .sound:focus-visible,.action:focus-visible,.doll-button:focus-visible,.share:focus-visible{outline:3px solid #f4a7b8;outline-offset:3px}
    h1{font-size:clamp(32px,8.1vw,47px);line-height:1.18;text-align:center;margin:5px 0 7px;letter-spacing:1px;font-weight:1000;color:#b94d70;text-shadow:0 4px 0 #fff8fa}
    h1 em{font-style:normal;display:inline-block;transform:rotate(11deg)}
    .subtitle{text-align:center;color:#a6828d;font-size:13px;margin:0 0 20px;letter-spacing:.7px;font-weight:600}
    .stage{position:relative;isolation:isolate;min-height:520px;padding:17px 10px 6px;border:2px solid #fff;background:linear-gradient(180deg,#ffe9e4 0%,#ffe3e6 49%,#ffd6d9 100%);border-radius:36px;box-shadow:inset 0 0 0 1px #e8abb259,0 18px 50px #db8e9e40,0 4px 0 #edc2c0;overflow:hidden}
    .stage:before{content:"";position:absolute;z-index:-1;width:480px;height:480px;max-width:95%;border-radius:50%;left:50%;top:90px;transform:translateX(-50%);background:radial-gradient(circle,#fffaf2 0%,#fff7f1b9 50%,#ffffff00 70%)}
    .stage:after{content:"";position:absolute;z-index:-1;width:70%;height:28px;background:#af65612a;filter:blur(15px);border-radius:50%;left:15%;bottom:15px}
    .star{position:absolute;font-size:21px;opacity:.65;animation:twinkle 2.6s ease-in-out infinite alternate;pointer-events:none}
    .star.s1{left:8%;top:105px}.star.s2{right:10%;top:165px;animation-delay:.9s}.star.s3{left:9%;bottom:140px;animation-delay:1.5s}.star.s4{right:12%;bottom:100px;animation-delay:2s}
    .stamp{position:absolute;left:18px;top:17px;border:1px solid #f5b6c2;color:#bd7183;font-size:10px;letter-spacing:1.2px;border-radius:12px;padding:7px 10px;background:#fffaf8aa;font-weight:900;transform:rotate(-7deg)}
    .counter{position:absolute;top:19px;right:17px;padding:8px 11px;background:#fff7f5d9;border:1px solid #fff;color:#bc6e7e;border-radius:14px;font-weight:800;font-size:11px;box-shadow:0 4px 12px #d58a9a18}
    .counter strong{font-size:18px;color:#dc6488;font-variant-numeric:tabular-nums;margin-left:3px}
    .bubble{position:relative;z-index:4;width:max-content;max-width:min(92%,365px);min-width:185px;margin:75px auto 1px;background:white;border:2px solid #ffd0d9;padding:13px 18px;border-radius:23px;box-shadow:0 8px 0 #eaa2b048,0 14px 24px #d77c9433;text-align:center;transform:rotate(-2deg)}
    .bubble:after{content:"";position:absolute;bottom:-13px;left:49%;width:18px;height:18px;background:white;border-right:2px solid #ffd0d9;border-bottom:2px solid #ffd0d9;transform:rotate(45deg)}
    .bubble .speech{display:block;font-size:clamp(18px,5.4vw,26px);font-weight:1000;letter-spacing:.5px;color:#b44f70;line-height:1.32}
    .bubble .subspeech{display:block;margin-top:4px;font-weight:700;font-size:11px;color:#b99ba5}
    .bubble.pop{animation:bubble-pop .42s cubic-bezier(.2,1.5,.4,1)}
    .doll-area{position:relative;max-width:350px;margin:-1px auto 0;height:360px;display:grid;place-items:end center}
    .doll-button{position:relative;width:min(94%,305px);height:100%;border:0;background:transparent;padding:0;cursor:grab;display:block;touch-action:pan-y;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 15px 9px #ae615638);transform-origin:50% 86%;transition:filter .2s}
    .doll-button:active{cursor:grabbing}
    .doll{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
    .doll-button.whacked{animation:bonk .49s cubic-bezier(.25,.8,.3,1)}
    .doll-button.mega{animation:big-bonk .62s cubic-bezier(.25,.8,.3,1)}
    .doll-button.happy{animation:jump .8s ease-out}
    .tears{position:absolute;inset:0;pointer-events:none;overflow:visible}
    .tear{position:absolute;top:35%;width:13px;height:19px;background:linear-gradient(145deg,#bbf7ff,#51bdeb);border:1.5px solid #fff;border-radius:60% 60% 65% 65%;box-shadow:0 1px 6px #3f9ee24a;opacity:0;transform:translateY(0) rotate(15deg)}
    .tear.l{left:41%}.tear.r{right:39%}
    .crying .tear.l{animation:cry 1.7s ease-in infinite}.crying .tear.r{animation:cry 1.7s ease-in .7s infinite}
    .wailing .tear{animation-duration:.92s!important}
    .wailing .tear.r{animation-delay:.36s!important}
    .emoji-tear{position:absolute;right:9%;top:48%;font-size:30px;opacity:0;transform:rotate(18deg);pointer-events:none}
    .wailing .emoji-tear{opacity:1;animation:wiggle 1.1s infinite}
    .hint{z-index:4;position:absolute;bottom:10px;left:50%;transform:translateX(-50%);white-space:nowrap;color:#a86d7a;font-size:10px;font-weight:800;background:#fff7f0bc;border:1px solid #ffffffa8;padding:7px 13px;border-radius:25px;letter-spacing:.4px}
    .particle-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:8}
    .particle{position:absolute;left:var(--x);top:var(--y);font-size:var(--size);will-change:transform,opacity;animation:burst .68s ease-out forwards;filter:drop-shadow(0 2px 2px #c8758333)}
    .panel{background:#fffcf9;border:1px solid white;border-radius:25px;margin:15px 3px 0;padding:18px;box-shadow:0 9px 25px #df9aa226}
    .panel-top{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#8f6672;font-weight:900;font-size:12px;margin-bottom:9px}
    .panel-top .percentage{font-variant-numeric:tabular-nums;color:#d96283}
    .bar{height:10px;background:#fbe4e7;border-radius:100px;overflow:hidden;box-shadow:inset 0 1px 3px #d595a13b;margin-bottom:15px}
    .fill{height:100%;width:0%;border-radius:100px;background:linear-gradient(90deg,#ff9ca8,#e65a81);transition:width .48s cubic-bezier(.2,.8,.3,1);box-shadow:0 1px 5px #df7692}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .action{border:0;border-radius:17px;padding:15px 8px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:14px;font-weight:950;letter-spacing:.1px;cursor:pointer;min-height:52px;transition:transform .13s,box-shadow .13s}
    .action:active{transform:translateY(3px) scale(.98);box-shadow:none}
    .primary{background:linear-gradient(160deg,#f27da0,#e85d85);color:#fff;box-shadow:0 6px 0 #c75d7d,0 8px 14px #e88ca35c}
    .secondary{background:#ffebee;border:1px solid #ffc9d4;color:#c45b7a;box-shadow:0 5px 0 #f2bdc8}
    .forgive{display:block;width:100%;margin-top:10px;background:#fff5df;border:1px solid #f8db9c;color:#b68a46;box-shadow:0 5px 0 #e7c887;min-height:47px}
    .listen{display:block;margin:12px auto 0;border:0;background:#fff1f4;color:#bd6681;font-size:12px;font-weight:900;border-radius:40px;padding:10px 18px;cursor:pointer}
    .listen:focus-visible{outline:3px solid #f4a7b8;outline-offset:3px}
    .micro{font-size:10px;color:#ae9299;text-align:center;margin:13px 0 0;line-height:1.6}
    .footer{display:flex;align-items:center;justify-content:center;gap:10px;padding:23px 0 2px;font-size:11px;color:#b8949e;font-weight:700}
    .footer .share{border:0;background:transparent;color:#c56b87;font-size:11px;font-weight:900;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:5px}
    .toast{position:fixed;z-index:20;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#754657;color:white;padding:11px 18px;border-radius:30px;font-size:12px;font-weight:800;transition:opacity .2s,transform .2s;box-shadow:0 8px 20px #6842573d;white-space:nowrap;max-width:90vw}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    .stage.redeemed{background:linear-gradient(180deg,#fff1de,#ffe6e9 65%,#ffd8db)}
    @keyframes bonk{0%,100%{transform:rotate(0) scale(1)}18%{transform:translateX(-13px) rotate(-9deg) scale(.97,1.04)}39%{transform:translateX(12px) rotate(8deg) scale(1.03,.95)}60%{transform:translateX(-6px) rotate(-4deg)}82%{transform:translateX(4px) rotate(2deg)}}
    @keyframes big-bonk{0%,100%{transform:rotate(0) scale(1)}14%{transform:translateY(10px) rotate(-12deg) scale(1.09,.88)}30%{transform:translateY(-12px) rotate(12deg) scale(.93,1.07)}49%{transform:translateY(8px) rotate(-10deg)}66%{transform:rotate(7deg)}83%{transform:rotate(-3deg)}}
    @keyframes jump{0%,100%{transform:translateY(0)}32%{transform:translateY(-24px) rotate(-5deg)}60%{transform:translateY(1px) rotate(4deg)}}
    @keyframes cry{0%{opacity:0;transform:translateY(0) scale(.45) rotate(12deg)}12%{opacity:1}70%{opacity:.9}100%{opacity:0;transform:translateY(86px) scale(1.2) rotate(-14deg)}}
    @keyframes bubble-pop{0%{transform:rotate(-2deg) scale(.8)}60%{transform:rotate(2deg) scale(1.09)}100%{transform:rotate(-2deg) scale(1)}}
    @keyframes burst{0%{opacity:0;transform:translate(0,0) scale(.3) rotate(0)}18%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.35) rotate(var(--rot))}}
    @keyframes twinkle{to{transform:translateY(-9px) rotate(12deg);opacity:.95}}
    @keyframes wiggle{50%{transform:rotate(-20deg) translateY(9px)}}
    @media(min-width:540px){.page{padding-top:26px}.stage{min-height:565px}.doll-area{height:405px;max-width:380px}.doll-button{width:340px}.bubble{margin-top:75px}.hint{bottom:15px}.panel{margin-top:17px}}
    @media(max-width:360px){.page{padding-left:11px;padding-right:11px}.stage{min-height:500px}.doll-area{height:345px}.bubble{margin-top:70px}.panel{padding:14px}.action{font-size:12px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>

  <script>
    (() => {
      'use strict';
      const $ = id => document.getElementById(id);
      const doll = $('dollButton'), stage = $('stage'), bubble = $('bubble');
      const speech = $('speech'), subspeech = $('subspeech'), particles = $('particles');
      const fill = $('fill'), percent = $('percent'), meter = $('meter');
      const voiceClips = {sorry:$('sorryVoice'),cry:$('cryVoice'),thanks:$('thanksVoice')};
      let hits = 0, voiceOn = true, forgiven = false, busy = false, audioContext = null, toastTimer, lastVoiceAt=0;
      const phrases = [
        ['我错了！🥺','（小声认错）'],
        ['我真的错了！','（眼睛开始湿润）'],
        ['我错了嘛…呜呜 🥹','（委屈巴巴）'],
        ['我错了！别不理我！','（眼泪啪嗒啪嗒）'],
        ['呜呜…我真的错了！😭','（哭成小水龙头）'],
        ['我错了！给我一次机会嘛！','（疯狂点头认错）'],
        ['我错了！再也不敢啦！','（诚意已拉满）']
      ];

      function popBubble(title, caption){
        speech.textContent = title; subspeech.textContent = caption;
        bubble.classList.remove('pop'); void bubble.offsetWidth; bubble.classList.add('pop');
      }
      function setScore(){
        const value = Math.min(100,hits * 12);
        $('count').textContent = String(hits); percent.textContent = value + '%';
        fill.style.width = value + '%'; meter.setAttribute('aria-valuenow',String(value));
      }
      function makeParticles(kind='hit', x, y){
        const box = stage.getBoundingClientRect();
        const centerX = x ?? box.width * .5, centerY = y ?? box.height * .55;
        const symbols = kind === 'love' ? ['💖','💗','💕','✨','🌸'] : ['💥','💫','💧','✨','🥺'];
        for(let i=0;i<(kind === 'love'?17:7);i++){
          const node=document.createElement('span'); node.className='particle'; node.textContent=symbols[Math.floor(Math.random()*symbols.length)];
          const angle=Math.PI * 2 * i/(kind === 'love'?17:7) + Math.random()*.35;
          const distance=(kind === 'love'?70:40) + Math.random()*(kind === 'love'?100:65);
          node.style.setProperty('--x',centerX+'px'); node.style.setProperty('--y',centerY+'px');
          node.style.setProperty('--dx',Math.cos(angle)*distance+'px'); node.style.setProperty('--dy',Math.sin(angle)*distance+'px');
          node.style.setProperty('--size',(16+Math.random()*13)+'px'); node.style.setProperty('--rot',(Math.random()*120-60)+'deg');
          particles.appendChild(node); node.addEventListener('animationend',()=>node.remove(),{once:true});
          setTimeout(()=>node.remove(),1100);
        }
      }
      function playPop(){
        if(!voiceOn) return;
        try{
          const AC=window.AudioContext||window.webkitAudioContext;
          if(!AC)return;
          audioContext=audioContext||new AC();
          if(audioContext.state==='suspended')audioContext.resume();
          const osc=audioContext.createOscillator(),gain=audioContext.createGain(),now=audioContext.currentTime;
          osc.type='sine';osc.frequency.setValueAtTime(530,now);osc.frequency.exponentialRampToValueAtTime(245,now+.12);
          gain.gain.setValueAtTime(.075,now);gain.gain.exponentialRampToValueAtTime(.001,now+.14);
          osc.connect(gain);gain.connect(audioContext.destination);osc.start(now);osc.stop(now+.15);
        }catch(e){}
      }
      function speakFallback(text='我错了！'){
        if(!voiceOn||!('speechSynthesis' in window))return;
        try{
          const u=new SpeechSynthesisUtterance(text);
          u.lang='zh-CN';u.rate=.88;u.pitch=1.1;u.volume=1;
          const voices=window.speechSynthesis.getVoices();
          const zh=voices.find(v=>/^zh[-_](CN|Hans)/i.test(v.lang))||voices.find(v=>/^zh/i.test(v.lang));
          if(zh)u.voice=zh;
          window.speechSynthesis.cancel();
          window.speechSynthesis.speak(u);
        }catch(e){}
      }
      function stopVoice(){
        for(const a of Object.values(voiceClips)){
          a.pause();try{a.currentTime=0;}catch(e){}
        }
        window.speechSynthesis?.cancel();
      }
      function playVoice(kind='sorry',force=false){
        if(!voiceOn)return;
        const now=Date.now();
        if(!force&&now-lastVoiceAt<850)return;
        lastVoiceAt=now;
        const audio=voiceClips[kind]||voiceClips.sorry;
        const words=kind==='cry'?'呜呜，我真的错了！':kind==='thanks'?'谢谢你原谅我，我以后会乖乖的。':'我错了！';
        stopVoice();
        try{
          audio.volume=1;audio.playbackRate=kind==='cry'?.92:.98;
          const result=audio.play();
          if(result?.catch)result.catch(error=>{
            if(error?.name==='AbortError')return;
            speakFallback(words);
            showToast('语音被浏览器拦截，点一下「试听」再试试 🔊');
          });
        }catch(e){speakFallback(words);}
      }
      function animateDoll(strong=false){
        doll.classList.remove('whacked','mega','happy');void doll.offsetWidth;
        doll.classList.add(strong?'mega':'whacked');
        setTimeout(()=>doll.classList.remove('whacked','mega'),650);
      }
      function hit(x,y,strong=false,silent=false){
        if(forgiven){forgiven=false;stage.classList.remove('redeemed');}
        hits++;setScore();
        const index=Math.min(phrases.length-1,Math.floor((hits-1)/2)+ (hits>=5?1:0));
        const [text,caption]=phrases[index];popBubble(text,caption);
        doll.classList.toggle('crying',hits>=2);doll.classList.toggle('wailing',hits>=6);
        animateDoll(strong||hits%5===0);makeParticles('hit',x,y);playPop();
        if(!silent)playVoice(hits>=4?'cry':'sorry');
        if(navigator.vibrate)navigator.vibrate(strong?[35,30,35]:23);
      }
      function pokeFromCenter(strong=false,silent=false){
        const b=stage.getBoundingClientRect();hit(b.width*.5+(Math.random()-.5)*100,b.height*.54,strong,silent);
      }
      function forgive(){
        if(busy)return;busy=true;forgiven=true;
        stopVoice();doll.classList.remove('crying','wailing','whacked','mega');stage.classList.add('redeemed');
        doll.classList.add('happy');popBubble('谢谢你原谅我！🥹💗','（保证以后乖乖的）');
        const b=stage.getBoundingClientRect();makeParticles('love',b.width*.5,b.height*.42);
        playVoice('thanks',true);
        $('forgiveBtn').textContent='🔁 再玩一轮';
        setTimeout(()=>{busy=false;doll.classList.remove('happy');},800);
      }
      function reset(){
        hits=0;forgiven=false;busy=false;setScore();
        doll.classList.remove('crying','wailing','happy','whacked','mega');stage.classList.remove('redeemed');
        $('forgiveBtn').textContent='🫶 算啦，原谅你一次';
        popBubble('我错了…求你原谅我 🥺','（眼泪汪汪，快要哭了）');
      }
      let pointerStart=null;
      doll.addEventListener('pointerdown',e=>{pointerStart={x:e.clientX,y:e.clientY};});
      doll.addEventListener('pointerup',e=>{
        if(!pointerStart)return;
        const dx=e.clientX-pointerStart.x,dy=e.clientY-pointerStart.y;
        const b=stage.getBoundingClientRect();hit(e.clientX-b.left,e.clientY-b.top,Math.abs(dx)>28||Math.abs(dy)>28);
        pointerStart=null;
      });
      doll.addEventListener('pointercancel',()=>pointerStart=null);
      doll.addEventListener('click',e=>{if(e.detail===0)pokeFromCenter();});
      $('pokeBtn').addEventListener('click',()=>pokeFromCenter());
      $('tripleBtn').addEventListener('click',()=>{
        if(busy)return;busy=true;
        pokeFromCenter(true);
        for(let i=1;i<3;i++)setTimeout(()=>{pokeFromCenter(true,true);if(i===2)busy=false;},i*210);
      });
      $('forgiveBtn').addEventListener('click',()=>forgiven?reset():forgive());
      $('listenBtn').addEventListener('click',()=>{
        if(!voiceOn){voiceOn=true;$('soundBtn').setAttribute('aria-pressed','true');$('soundBtn').firstChild.textContent='🔊 ';$('soundText').textContent='语音开';}
        playVoice('sorry',true);
        showToast('已播放道歉语音，请检查手机媒体音量 🔊');
      });
      $('soundBtn').addEventListener('click',()=>{
        voiceOn=!voiceOn;
        $('soundBtn').setAttribute('aria-pressed',String(voiceOn));
        $('soundBtn').firstChild.textContent=voiceOn?'🔊 ':'🔇 ';
        $('soundText').textContent=voiceOn?'语音开':'语音关';
        if(!voiceOn)stopVoice();else playVoice('sorry',true);
        showToast(voiceOn?'语音已开启，戳戳他试试 🔊':'已切换为静音模式 🤫');
      });
      function showToast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2300);}
      $('shareBtn').addEventListener('click',async()=>{
        const data={title:'对不起啦！🥹',text:'快来戳戳这个会哭的道歉小人！',url:location.href};
        if(navigator.share && /^https?:/.test(location.protocol)){
          try{await navigator.share(data);return;}catch(e){if(e.name==='AbortError')return;}
        }
        if(navigator.clipboard && /^https?:/.test(location.protocol)){
          try{await navigator.clipboard.writeText(location.href);showToast('链接复制好啦，快发给朋友 💌');return;}catch(e){}
        }
        showToast('下载这个 HTML 文件，直接发给朋友就能玩 💌');
      });
      setScore();
    })();
  </script>
</body>
</html>
